[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-telemetry-lakehouse"
version = "0.1.0"
description = "Security telemetry pipeline: Wazuh-style logs -> OCSF-like Parquet lakehouse -> dbt detections on DuckDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyarrow>=14",
    "duckdb>=1.0",
    "dbt-duckdb>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
stl = "stl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
